# Origami dashboard with one sections view.
# Paste it into the raw configuration editor of a new dashboard.
# The entity IDs are examples. The helpers it reads are in packages/origami.yaml.

title: Origami
views:
  - type: sections
    title: Home
    path: home
    icon: mdi:home-heart
    max_columns: 2
    dense_section_placement: false
    sections:
      # Header menu, greeting, notifications and weather
      - type: grid
        column_span: 2
        cards:
          # Menu (Origami Header), opened by More in the navbar
          - type: custom:origami-header-card
            mode: menu
            position: top
            layout: grid
            all_users: true
            buttons:
              - name: Files
                icon: mdi:folder-outline
                tap_action:
                  action: navigate
                  navigation_path: /app/core_configurator
              - name: Autom.
                icon: mdi:robot-outline
                tap_action:
                  action: navigate
                  navigation_path: /config/automation/dashboard
              - name: Menu
                icon: mdi:menu
                special: sidebar
              - name: Edit
                icon: mdi:pencil-outline
                special: edit
            cards:
              type: custom:paper-buttons-row
              extra_styles: '.flex-box:active { transform: scale(var(--press-scale)) }'
              styles:
                position: relative
                gap: var(--ha-space-3)
                padding: var(--ha-space-4) var(--ha-space-5) var(--ha-space-4) var(--ha-space-4)
                background-color: var(--ha-card-background)
                border-radius: var(--ha-card-border-radius)
                box-shadow: var(--ha-card-box-shadow)
              base_config:
                layout: name|state
                tooltip: false
                styles:
                  button:
                    flex-direction: column
                    padding: 0px
                  name:
                    padding: 0px
                    white-space: nowrap
                    font-weight: var(--ha-font-weight-bold)
                    line-height: var(--ha-line-height-normal)
                  state:
                    padding: 0px
                    margin-top: var(--ha-space-1)
                    white-space: nowrap
                    font-size: 12px
                    font-weight: var(--ha-font-weight-medium)
                    line-height: var(--ha-line-height-condensed)
                    color: var(--secondary-text-color)
              buttons:
                # Invisible overlay: the whole card opens the server pop-up
                - layout: name
                  name: ' '
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_server'
                  styles:
                    button:
                      position: absolute
                      inset: 0px
                # Status chip: ok, info (updates), warn or crit
                - layout: icon
                  icon: mdi:check-bold
                  state: >-
                    {%- set c = states('sensor.system_monitor_processor_use') | float(-1) -%}
                    {%- set r = states('sensor.system_monitor_memory_usage') | float(-1) -%}
                    {%- set s = states('sensor.system_monitor_disk_usage') | float(-1) -%}
                    {%- set b = as_timestamp(states('sensor.backup_last_successful_automatic_backup'), default=none) -%}
                    {%- set a = (now().timestamp() - b) if b is not none else 0 -%}
                    {%- set u = states.update | selectattr('state', 'eq', 'on') | list | count -%}
                    {%- if s > 90 or r > 95 or c > 95 or a > 604800 -%}crit
                    {%- elif s > 80 or r > 85 or c > 80 or a > 259200 or (c < 0 and r < 0 and s < 0) -%}warn
                    {%- elif u > 0 -%}info
                    {%- else -%}ok
                    {%- endif -%}
                  state_icons:
                    info: mdi:arrow-up-thick
                    warn: mdi:exclamation-thick
                    crit: mdi:close-thick
                  state_styles:
                    info:
                      button:
                        color: var(--accent-color)
                    warn:
                      button:
                        color: var(--warning-color)
                    crit:
                      button:
                        color: var(--error-color)
                  tap_action:
                    action: none
                  styles:
                    button:
                      color: var(--success-color)
                      pointer-events: none
                    icon:
                      display: flex
                      align-items: center
                      justify-content: center
                      width: var(--control-height-icon)
                      height: var(--control-height-icon)
                      border-radius: var(--radius-inner)
                      background-color: currentColor
                      box-shadow: 0 0 0 5px color-mix(in srgb, currentColor 12%, transparent)
                      --mdc-icon-size: var(--icon-size-xs)
                      --icon-primary-color: var(--text-color-active)
                # Status text and uptime
                - name: >-
                    {%- set c = states('sensor.system_monitor_processor_use') | float(-1) -%}
                    {%- set r = states('sensor.system_monitor_memory_usage') | float(-1) -%}
                    {%- set s = states('sensor.system_monitor_disk_usage') | float(-1) -%}
                    {%- set b = as_timestamp(states('sensor.backup_last_successful_automatic_backup'), default=none) -%}
                    {%- set a = (now().timestamp() - b) if b is not none else 0 -%}
                    {%- set u = states.update | selectattr('state', 'eq', 'on') | list | count -%}
                    {%- if s > 90 -%}Disk almost full
                    {%- elif r > 95 -%}Memory low
                    {%- elif c > 95 -%}CPU high
                    {%- elif a > 259200 -%}Backup due
                    {%- elif s > 80 -%}Disk almost full
                    {%- elif r > 85 -%}Memory low
                    {%- elif c > 80 -%}CPU high
                    {%- elif c < 0 and r < 0 and s < 0 -%}No data
                    {%- elif u > 0 -%}{{ u }} {{ 'update' if u == 1 else 'updates' }}
                    {%- else -%}All good
                    {%- endif -%}
                  state: >-
                    {%- set n = as_timestamp(states('sensor.system_monitor_last_boot'), default=none) -%}
                    {%- set d = [(now().timestamp() - n) | int, 0] | max if n is not none else -1 -%}
                    {%- if d < 0 -%}Uptime unknown
                    {%- elif d >= 86400 -%}Up {{ d // 86400 }} {{ 'day' if d < 172800 else 'days' }}
                    {%- elif d >= 3600 -%}Up {{ d // 3600 }} {{ 'hour' if d < 7200 else 'hours' }}
                    {%- else -%}Up {{ [d // 60, 1] | max }} {{ 'minute' if d < 120 else 'minutes' }}
                    {%- endif -%}
                  tap_action:
                    action: none
                  styles:
                    button:
                      flex: 1
                      min-width: 0px
                      align-items: flex-start
                      pointer-events: none
                    name:
                      max-width: 100%
                      overflow: hidden
                      text-overflow: ellipsis
                      font-size: var(--ha-font-size-l)
                    state:
                      max-width: 100%
                      overflow: hidden
                      text-overflow: ellipsis
                # CPU and memory, coloured when high
                - name: >-
                    {%- set v = states('sensor.system_monitor_processor_use') | float(none) -%}
                    {{ ((v | round(0) | int) ~ ' %') if v is not none else '–' }}
                  state: CPU
                  tap_action:
                    action: more-info
                    entity: sensor.system_monitor_processor_use
                  styles:
                    button:
                      min-width: 44px
                      align-items: flex-end
                    name:
                      font-size: var(--ha-font-size-m)
                      font-variant-numeric: tabular-nums
                      color: >-
                        {%- set v = states('sensor.system_monitor_processor_use') | float(0) -%}
                        {{ 'var(--error-color)' if v > 95 else ('var(--warning-color)' if v > 80 else 'var(--primary-text-color)') }}
                - name: >-
                    {%- set v = states('sensor.system_monitor_memory_usage') | float(none) -%}
                    {{ ((v | round(0) | int) ~ ' %') if v is not none else '–' }}
                  state: RAM
                  tap_action:
                    action: more-info
                    entity: sensor.system_monitor_memory_usage
                  styles:
                    button:
                      min-width: 44px
                      align-items: flex-end
                    name:
                      font-size: var(--ha-font-size-m)
                      font-variant-numeric: tabular-nums
                      color: >-
                        {%- set v = states('sensor.system_monitor_memory_usage') | float(0) -%}
                        {{ 'var(--error-color)' if v > 95 else ('var(--warning-color)' if v > 85 else 'var(--primary-text-color)') }}
            css: |-
              .scrim {
                backdrop-filter: blur(14px);
                background:
                  linear-gradient(var(--card-shadow-color), var(--card-shadow-color)),
                  color-mix(in srgb, var(--primary-background-color) 28%, transparent);
              }
              .sheet {
                padding: var(--ha-space-5) var(--ha-space-5) var(--ha-space-6) var(--ha-space-5);
                gap: var(--ha-space-5);
                box-shadow: var(--ha-card-box-shadow);
              }
              .buttons {
                gap: var(--ha-space-3);
              }
              .button {
                background: none;
                box-shadow: none;
                padding: 0 !important;
                gap: 12px !important;
              }
              .button ha-ripple {
                display: none;
              }
              .sheet .buttons .button ha-icon {
                width: 100%;
                height: 72px;
                border-radius: var(--radius-inner);
                color: var(--color, var(--primary-text-color));
                background: var(--fill-subtle);
              }
              .button:active ha-icon {
                transform: scale(var(--press-scale));
              }
              .name {
                display: block;
                white-space: nowrap;
                font-size: 13px;
              }

          # Next event and greeting, notifications next to it
          - type: grid
            square: false
            columns: 2
            cards:
              - type: custom:paper-buttons-row
                extra_styles: ':host { display: block; height: 100% }'
                styles:
                  flex-direction: column
                  justify-content: center
                  height: 100%
                  gap: var(--ha-space-1)
                base_config:
                  layout: state
                  tap_action:
                    action: none
                  styles:
                    button:
                      min-height: unset
                      padding: 0px
                      align-self: flex-start
                      justify-content: flex-start
                      pointer-events: none
                    state:
                      padding: 0px
                buttons:
                  - entity: calendar.household
                    state:
                      attribute: message
                    styles:
                      state:
                        font-size: var(--ha-font-size-s)
                        font-weight: var(--ha-font-weight-bold)
                        color: var(--secondary-text-color)
                        white-space: nowrap
                        overflow: hidden
                        text-overflow: ellipsis
                        max-width: 100px
                  - entity: sensor.greetings
                    state:
                      case: first
                    styles:
                      state:
                        font-size: var(--ha-font-size-l)
                        font-weight: var(--ha-font-weight-bold)
                        white-space: nowrap
                        overflow: hidden
                        text-overflow: ellipsis
              - type: custom:origami-notifications
                entities:
                  - sensor.dwd_current_warning_level
                  - sensor.dwd_advance_warning_level
                  - entity: calendar.household
                    before:
                      days: 1
                  - timer.pizza
                  - entity: sensor.oven_ready_in
                    type: countdown
                    name: Oven
                  - vacuum.robot
                  - entity: sensor.dinner
                    actions:
                      - label: Open recipe
                        tap_action:
                          action: url
                          url_path: https://tandoor.dev
                weather: weather.home
                hide_when_empty: false
                rotate: 3
                css: |
                  :host {
                    --origami-pad: var(--ha-space-4);
                    --origami-gap: var(--ha-space-4);
                    --origami-tile: var(--ha-space-9);
                    --origami-icon: var(--icon-size-m);
                    --origami-radius: var(--radius-inner);
                    --origami-card-bg: var(--fill-subtle);
                    --origami-row-bg: var(--fill-subtle);
                    --accent-color: var(--fill-active);
                    --ha-tile-info-primary-font-size: var(--ha-font-size-m);
                    --ha-tile-info-primary-font-weight: var(--ha-font-weight-bold);
                    --ha-tile-info-secondary-font-size: var(--ha-font-size-s);
                    --ha-tile-info-secondary-font-weight: var(--ha-font-weight-bold);
                    --ha-tile-info-secondary-color: var(--secondary-text-color);
                  }
                  ha-card { box-shadow: none; }
                  .texts { min-height: calc(var(--origami-tile) + 2 * var(--origami-pad)); }
                  .slide { gap: var(--ha-space-1); }
                  .icon {
                    border-radius: var(--radius-inner);
                    background: color-mix(in srgb, var(--tile-color) var(--tint-strength), var(--ha-card-background, var(--card-background-color)));
                    box-shadow: var(--ha-card-box-shadow, none);
                  }
                  .head .icon.idle { color: var(--primary-text-color); }
                  .badge {
                    top: -6px;
                    inset-inline-end: -6px;
                    min-width: 20px;
                    height: 20px;
                    padding: 0 6px;
                    border-radius: 10px;
                    font-size: 12px;
                    font-weight: var(--ha-font-weight-bold);
                    box-shadow: none;
                  }
                  .list { gap: var(--ha-space-2); }
                  .row { padding: var(--ha-space-3); }
                  .row .title {
                    font-size: var(--ha-font-size-m);
                    font-weight: var(--ha-font-weight-bold);
                  }
                  .row .message { font-size: var(--ha-font-size-s); }

          # Desktop only: extra space above the weather card
          - type: grid
            square: false
            columns: 1
            visibility:
              - condition: screen
                media_query: '(min-width: 768px)'
            grid_options:
              columns: 24
              rows: auto
            cards:
              - type: custom:paper-buttons-row
                base_config:
                  layout: icon
                  styles:
                    button:
                      min-height: 76px
                      pointer-events: none
                    icon:
                      --mdc-icon-size: 0px
                buttons:
                  - icon: mdi:backspace-reverse

          # Weather
          - type: custom:origami-weather
            weather_entity: weather.home
            sun_enabled: false
            moon_enabled: false
            color_mode: theme
            card_height: 160px
            card_padding: 20px
            card_offset: 16px 0px 12px 0px
            # A calm colour per condition instead of the sky. Clouds and the other effects are off, rain and snow still show.
            background_mode: color
            background_threshold_entity: weather.home
            background_thresholds:
              - value: sunny
                color: '#e7e2d9'
                color_dark: '#24211d'
              - value: clear-night
                color: '#dbdce1'
                color_dark: '#15181f'
              - value: partlycloudy
                color: '#e0deda'
                color_dark: '#1c2023'
              - value: cloudy
                color: '#d3d4d6'
                color_dark: '#222324'
              - value: fog
                color: '#e6e6e5'
                color_dark: '#272829'
              - value: windy
                color: '#dadfdd'
                color_dark: '#1c201e'
              - value: windy-variant
                color: '#d5dad9'
                color_dark: '#1a1f1e'
              - value: rainy
                color: '#cdd2d6'
                color_dark: '#181e22'
              - value: pouring
                color: '#c8cdd2'
                color_dark: '#14191e'
              - value: lightning
                color: '#cfced3'
                color_dark: '#1c1b21'
              - value: lightning-rainy
                color: '#cacacf'
                color_dark: '#18171e'
              - value: snowy
                color: '#e6eaed'
                color_dark: '#252b2e'
              - value: snowy-rainy
                color: '#d8dddf'
                color_dark: '#1f2527'
              - value: hail
                color: '#d2d9da'
                color_dark: '#1c2324'
              - value: exceptional
                color: '#ded8d2'
                color_dark: '#27221f'
            cloud_effects: false
            night_sky_effects: false
            bird_effects: false
            balloon_effects: false
            plane_effects: false
            grid_options:
              rows: auto
              columns: 12
            button_containers:
              # The house, 20 px from the top, right and bottom edge. The drawing
              # doesn't fill its picture, so the offsets are negative.
              - position: custom
                position_anchor: top-right
                position_x: -32px
                position_y: -10px
                custom_width: 168px
                image: demo-home-image
              # Next sunset, or sunrise while the sun is down
              - position: custom
                position_anchor: top-left
                button_gap: 6px
                buttons:
                  - entity: sun.sun
                    visibility:
                      - condition: state
                        entity: sun.sun
                        state: above_horizon
                    elements:
                      - type: text
                        size: 12px
                        weight: '500'
                        color: var(--secondary-text-color)
                        text: Sunset
                      - type: text
                        size: 12px
                        weight: '500'
                        color: var(--primary-text-color)
                        entity: sun.sun
                        attribute: next_setting
                  - entity: sun.sun
                    visibility:
                      - condition: state
                        entity: sun.sun
                        state: below_horizon
                    elements:
                      - type: text
                        size: 12px
                        weight: '500'
                        color: var(--secondary-text-color)
                        text: Sunrise
                      - type: text
                        size: 12px
                        weight: '500'
                        color: var(--primary-text-color)
                        entity: sun.sun
                        attribute: next_rising
              # Temperature and condition
              - position: custom
                position_anchor: bottom-left
                gap: 5px
                buttons:
                  - entity: weather.home
                    width: 100%
                    elements:
                      - type: text
                        size: 48px
                        weight: '700'
                        color: var(--primary-text-color)
                        attribute: temperature
                        precision: 0
                        format: °
                  - entity: weather.home
                    elements:
                      - type: text
                        size: 12px
                        weight: '500'
                        color: var(--primary-text-color)

      # Favorites
      - type: grid
        column_span: 1
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Favorites
            modules:
              - origami_header
            origami_header:
              icon_size: var(--icon-size-m)
            grid_options:
              columns: full
              rows: auto
            sub_button:
              main:
                - name: All
                  icon: mdi:chevron-right
                  show_name: true
                  content_layout: icon-right
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_favorites'

          # Each tile is a sub-button. Bubble's visibility decides when it exists.
          - type: custom:bubble-card
            card_type: sub-buttons
            modules:
              - origami_tiles
            grid_options:
              columns: full
              rows: auto
            sub_button:
              bottom:
                # Music, late in the evening only
                - name: Bedroom
                  entity: media_player.bedroom
                  icon: mdi:speaker
                  force_icon: true
                  origami_tiles:
                    state: Music
                    color: var(--state-media_player-active-color)
                  visibility:
                    - condition: time
                      after: '22:00'
                      before: '03:59:59'
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_music'
                  hold_action:
                    action: more-info
                # Fan: in warm weather or while it runs
                - name: Fan
                  entity: fan.bedroom
                  icon: mdi:fan
                  origami_tiles:
                    state:
                      'on': ${attr.percentage} %
                      'off': 'Off'
                  visibility:
                    - condition: state
                      entity: fan.bedroom
                      state_not:
                        - unavailable
                        - unknown
                    - condition: or
                      conditions:
                        - condition: state
                          entity: fan.bedroom
                          state: 'on'
                        - condition: numeric_state
                          entity: sensor.living_room_temperature
                          above: 24
                        - condition: numeric_state
                          entity: sensor.bedroom_temperature
                          above: 24
                  tap_action:
                    action: toggle
                  hold_action:
                    action: more-info
                # Dinner: the recipe photo is the icon
                - name: Cooking
                  entity: sensor.dinner
                  icon: mdi:chef-hat
                  origami_tiles:
                    state: Dinner
                    image: ${attr.recipe?.image}
                  visibility:
                    - condition: state
                      entity: sensor.dinner
                      state_not:
                        - unknown
                        - unavailable
                    - condition: time
                      after: '14:00'
                      before: '20:59:59'
                  tap_action:
                    action: url
                    url_path: https://tandoor.dev
                  hold_action:
                    action: more-info
                # Oven: only while it's on, and always first
                - name: Oven
                  entity: sensor.oven
                  icon: mdi:toaster-oven
                  origami_tiles:
                    color: var(--state-climate-heat-color)
                    order: -2
                  visibility:
                    - condition: state
                      entity: sensor.oven
                      state_not: 'Off'
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_kitchen'
                  hold_action:
                    action: more-info
                # Vacuum: while it cleans, the progress becomes the name
                - name: Vacuum
                  entity: vacuum.robot
                  icon: mdi:robot-vacuum
                  force_icon: true
                  origami_tiles:
                    name: >-
                      ${(p => Number.isNaN(p) || p < 0 ? 'Error'
                      : ['docked', 'returning'].includes(state) || p >= 99 ? 'Vacuum'
                      : p + ' %')(Math.round(states('number.robot_cleaning_progress')))}
                    state:
                      docked: 'Off'
                      idle: 'Off'
                      cleaning: Vacuum
                    order:
                      cleaning: -1
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_vacuum'
                  hold_action:
                    action: more-info
                # Bath: minutes left while it runs
                - name: Bath
                  entity: input_boolean.bath_time
                  icon: mdi:shower
                  origami_tiles:
                    name:
                      'on': ${minutesUntil('input_datetime.bath_time_end')} min
                    state:
                      'on': Running
                      'off': Ready
                    color:
                      'on': var(--blue-color)
                  visibility:
                    - condition: or
                      conditions:
                        - condition: state
                          entity: input_boolean.bath_time
                          state: 'on'
                        - condition: time
                          after: '11:00'
                          before: '22:59:59'
                  tap_action:
                    action: toggle
                  hold_action:
                    action: more-info
                # Printer: minutes left while it prints
                - name: Printer
                  entity: switch.printer
                  icon: mdi:printer-outline
                  origami_tiles:
                    name:
                      'on': ${minutesUntil('input_datetime.printer_end')} min
                    state:
                      'on': Running
                      'off': 'Off'
                    name_color:
                      'on': initial
                  tap_action:
                    action: toggle
                  hold_action:
                    action: more-info

      # Rooms
      - type: grid
        column_span: 1
        cards:
          # Desktop only: status row
          - type: grid
            square: false
            columns: 1
            visibility:
              - condition: screen
                media_query: '(min-width: 768px)'
            cards:
              - type: custom:paper-buttons-row
                extra_styles: 'paper-button:active { transform: scale(.96) }'
                styles:
                  display: grid
                  grid-template-columns: repeat(24, minmax(0, 1fr))
                  gap: 0px
                  padding: var(--ha-space-8)
                  background-color: var(--fill-subtle)
                  border-radius: var(--ha-card-border-radius)
                  box-shadow: none
                base_config:
                  entity: sensor.climate_home
                  tap_action:
                    action: more-info
                  styles:
                    button:
                      grid-column: span 8
                      height: 84px
                      padding: 0px 6px
                      background: transparent
                      box-shadow: none
                      border-radius: 0px
                      justify-content: center
                      align-items: center
                    icon:
                      --mdc-icon-size: 27px
                      margin-right: 0px
                      opacity: 1
                    name:
                      padding: 0px
                      margin-top: 9px
                      font-size: 13px
                      font-weight: 600
                      opacity: 0.5
                    state:
                      padding: 0px
                      margin-top: 6px
                      font-size: 20px
                      font-weight: 700
                      color: var(--primary-text-color)
                buttons:
                  - entity: zone.home
                    layout: icon_name_state
                    icon: mdi:account-group-outline
                    name: Home
                    state:
                      postfix: ' people'
                    state_styles:
                      '0':
                        icon:
                          color: var(--secondary-text-color)
                    styles:
                      button:
                        border-right: 2px solid var(--border-color)
                      icon:
                        color: var(--success-color)
                  - layout: icon_name_state
                    icon: mdi:lock-outline
                    name: Front door
                    state:
                      attribute: front_door_open
                    state_text:
                      'off': Closed
                      'on': Open
                    state_icons:
                      'on': mdi:lock-open-variant-outline
                    state_styles:
                      'on':
                        icon:
                          color: var(--error-color)
                          opacity: 1
                    tap_action:
                      action: more-info
                      entity: binary_sensor.front_door
                    styles:
                      button:
                        border-right: 2px solid var(--border-color)
                      icon:
                        color: var(--success-color)
                  - entity: sensor.windows_open_count
                    layout: icon_name_state
                    icon: mdi:window-open-variant
                    name: Windows
                    state:
                      postfix: ' open'
                    state_icons:
